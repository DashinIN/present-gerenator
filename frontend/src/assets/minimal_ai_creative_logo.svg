<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minimal AI creative generation logo icon">
  <defs>
    <linearGradient id="aiGradient" x1="258" y1="236" x2="780" y2="806" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="48%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.36
                0 0 0 0 0.28
                0 0 0 0 0.95
                0 0 0 0.22 0"/>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
  </defs>

  <!-- Transparent background by design -->

  <!-- Creative spark -->
  <path
    d="M418 236
       C438 376 470 406 610 426
       C470 446 438 476 418 616
       C398 476 366 446 226 426
       C366 406 398 376 418 236Z"
    fill="url(#aiGradient)"
    filter="url(#softGlow)"/>

  <!-- Minimal AI orbit / connection -->
  <path
    d="M548 354
       C632 372 690 430 704 510
       C720 602 666 686 574 720"
    stroke="url(#aiGradient)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Neural branches -->
  <path
    d="M704 510
       C754 488 782 450 800 398"
    stroke="url(#aiGradient)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <path
    d="M704 510
       C760 540 792 584 806 650"
    stroke="url(#aiGradient)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Nodes -->
  <circle cx="548" cy="354" r="39" fill="white" stroke="url(#aiGradient)" stroke-width="32"/>
  <circle cx="800" cy="398" r="39" fill="white" stroke="url(#aiGradient)" stroke-width="32"/>
  <circle cx="806" cy="650" r="39" fill="white" stroke="url(#aiGradient)" stroke-width="32"/>
</svg>
